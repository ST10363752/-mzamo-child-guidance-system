<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Mzamo Child Guidance</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== FULL PAGE STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0d2f45 0%, #1a4a6b 50%, #2c6f96 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Open Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* ===== LOGIN BOX ===== */
        .login-box {
            background: #ffffff;
            padding: 45px 40px 40px;
            border-radius: 16px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== LOGO AREA ===== */
        .login-box .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-box .logo-area .logo-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 5px;
        }

        .login-box .logo-area h1 {
            color: #1a4a6b;
            font-family: 'Playfair Display', 'Georgia', serif;
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .login-box .logo-area .subtitle {
            color: #888;
            font-size: 0.9rem;
            font-weight: 400;
            margin-top: 4px;
        }

        .login-box .logo-area .divider {
            width: 60px;
            height: 3px;
            background: #e8a838;
            margin: 12px auto 0;
            border-radius: 2px;
        }

        /* ===== FORM STYLES ===== */
        .login-box label {
            display: block;
            font-weight: 600;
            margin-top: 18px;
            margin-bottom: 4px;
            color: #333;
            font-size: 0.9rem;
        }

        .login-box label:first-of-type {
            margin-top: 0;
        }

        .login-box .input-group {
            position: relative;
        }

        .login-box .input-group .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 1.1rem;
        }

        .login-box input {
            width: 100%;
            padding: 13px 15px 13px 45px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 1rem;
            background: #f8f9fa;
            transition: all 0.3s ease;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
        }

        .login-box input:focus {
            outline: none;
            border-color: #1a4a6b;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(26, 74, 107, 0.1);
        }

        .login-box input::placeholder {
            color: #bbb;
            font-size: 0.95rem;
        }

        /* ===== PASSWORD TOGGLE ===== */
        .password-toggle {
            position: relative;
        }

        .password-toggle .toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: #aaa;
            padding: 5px;
            transition: color 0.3s ease;
        }

        .password-toggle .toggle-btn:hover {
            color: #1a4a6b;
        }

        /* ===== REMEMBER ME ===== */
        .remember-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            font-size: 0.9rem;
        }

        .remember-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 400;
            color: #666;
            margin: 0;
            cursor: pointer;
        }

        .remember-row label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1a4a6b;
            margin: 0;
            padding: 0;
            cursor: pointer;
        }

        .remember-row a {
            color: #1a4a6b;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            transition: color 0.3s ease;
        }

        .remember-row a:hover {
            color: #e8a838;
        }

        /* ===== LOGIN BUTTON ===== */
        .login-box .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #e8a838 0%, #c48a2a 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 22px;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(232, 168, 56, 0.35);
            font-family: 'Open Sans', sans-serif;
        }

        .login-box .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(232, 168, 56, 0.45);
        }

        .login-box .login-btn:active {
            transform: translateY(0);
        }

        /* ===== MESSAGE ===== */
        .message {
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: 10px;
            display: none;
            font-weight: 500;
            font-size: 0.95rem;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.error {
            display: block;
            background: #fde8ea;
            color: #a71d2a;
            border: 1px solid #f5c6cb;
        }

        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        /* ===== BACK LINK ===== */
        .login-box .back-link {
            text-align: center;
            margin-top: 20px;
            display: block;
            color: #888;
            font-weight: 500;
            font-size: 0.9rem;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .login-box .back-link:hover {
            color: #1a4a6b;
        }

        .login-box .back-link span {
            margin-right: 6px;
        }

        /* ===== FOOTER TEXT ===== */
        .login-box .footer-text {
            text-align: center;
            margin-top: 18px;
            font-size: 0.75rem;
            color: #bbb;
            border-top: 1px solid #f0f0f0;
            padding-top: 18px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px 25px;
            }

            .login-box .logo-area h1 {
                font-size: 1.4rem;
            }

            .login-box input {
                padding: 12px 12px 12px 40px;
                font-size: 0.95rem;
            }

            .login-box .login-btn {
                padding: 13px;
                font-size: 1rem;
            }

            .remember-row {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }

        @media (max-width: 360px) {
            .login-box {
                padding: 20px 15px 20px;
            }

            .login-box .logo-area .logo-icon {
                font-size: 2.2rem;
            }

            .login-box .logo-area h1 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-box">
        <!-- ===== LOGO AREA ===== -->
        <div class="logo-area">
            <span class="logo-icon">🌟</span>
            <h1>Mzamo Child Guidance</h1>
            <p class="subtitle">Administration Portal</p>
            <div class="divider"></div>
            <p style="color: #999; font-size: 0.85rem; margin-top: 10px;">Training Initiative of KZN • Est. 1981</p>
        </div>

        <!-- ===== LOGIN FORM ===== -->
        <form id="adminLoginForm" autocomplete="off">

            <!-- Email -->
            <label for="adminEmail">📧 Email Address</label>
            <div class="input-group">
                <span class="input-icon">📧</span>
                <input
                    type="email"
                    id="adminEmail"
                    placeholder="admin@mzamo.org"
                    required
                    autocomplete="username"
                >
            </div>

            <!-- Password -->
            <label for="adminPassword">🔒 Password</label>
            <div class="input-group password-toggle">
                <span class="input-icon">🔑</span>
                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
                <button type="button" class="toggle-btn" id="togglePassword" aria-label="Toggle password visibility">
                    👁️
                </button>
            </div>

            <!-- Remember Me Row -->
            <div class="remember-row">
                <label>
                    <input type="checkbox" id="rememberMe">
                    Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <!-- Login Button -->
            <button type="submit" class="login-btn">🔐 Log In</button>

            <!-- Message Area -->
            <div id="loginMessage" class="message"></div>
        </form>

        <!-- ===== BACK LINK ===== -->
        <a href="index.html" class="back-link">
            <span>←</span> Back to Website
        </a>

        <!-- ===== FOOTER ===== -->
        <div class="footer-text">
            Protected • Secure Login
        </div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // ============================================================
        // ADMIN LOGIN - COMPLETE JAVASCRIPT
        // ============================================================

        document.addEventListener('DOMContentLoaded', function() {

            // ===== GET ELEMENTS =====
            const form = document.getElementById('adminLoginForm');
            const emailInput = document.getElementById('adminEmail');
            const passwordInput = document.getElementById('adminPassword');
            const toggleBtn = document.getElementById('togglePassword');
            const rememberCheck = document.getElementById('rememberMe');
            const messageDiv = document.getElementById('loginMessage');

            // ===== TOGGLE PASSWORD VISIBILITY =====
            if (toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    toggleBtn.textContent = type === 'password' ? '👁️' : '🙈';
                });
            }

            // ===== LOAD SAVED EMAIL =====
            const savedEmail = localStorage.getItem('adminEmail');
            if (savedEmail) {
                emailInput.value = savedEmail;
                rememberCheck.checked = true;
            }

            // ===== FORM SUBMISSION =====
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();

                    const email = emailInput.value.trim();
                    const password = passwordInput.value.trim();

                    // ===== VALIDATION =====
                    if (!email || !password) {
                        showMessage('❌ Please enter both email and password.', 'error');
                        return;
                    }

                    // Simple email format validation
                    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailPattern.test(email)) {
                        showMessage('❌ Please enter a valid email address.', 'error');
                        return;
                    }

                    // ===== DEMO CREDENTIALS =====
                    // In a real system, this would be a server-side authentication
                    const DEMO_EMAIL = 'admin@mzamo.org';
                    const DEMO_PASSWORD = 'admin123';

                    if (email === DEMO_EMAIL && password === DEMO_PASSWORD) {
                        // ===== SUCCESS =====
                        // Save session
                        sessionStorage.setItem('adminLoggedIn', 'true');
                        sessionStorage.setItem('adminEmail', email);

                        // Save email if "Remember me" is checked
                        if (rememberCheck.checked) {
                            localStorage.setItem('adminEmail', email);
                        } else {
                            localStorage.removeItem('adminEmail');
                        }

                        showMessage('✅ Login successful! Redirecting...', 'success');

                        // Redirect to dashboard
                        setTimeout(function() {
                            window.location.href = 'admin-dashboard.html';
                        }, 1200);

                    } else {
                        // ===== FAILURE =====
                        showMessage('❌ Invalid email or password. Please try again.', 'error');
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                });
            }

            // ===== HELPER: SHOW MESSAGE =====
            function showMessage(text, type) {
                if (messageDiv) {
                    messageDiv.textContent = text;
                    messageDiv.className = 'message ' + type;
                    messageDiv.style.display = 'block';
                }
            }

            // ===== ENTER KEY SUPPORT =====
            // Already handled by form submission

            // ===== CLEAR MESSAGE ON INPUT =====
            emailInput.addEventListener('input', function() {
                if (messageDiv && messageDiv.style.display === 'block') {
                    messageDiv.style.display = 'none';
                }
            });

            passwordInput.addEventListener('input', function() {
                if (messageDiv && messageDiv.style.display === 'block') {
                    messageDiv.style.display = 'none';
                }
            });

            console.log('✅ Admin login page loaded successfully!');
            console.log('🔑 Demo credentials: admin@mzamo.org / admin123');
        });
    </script>

</body>
</html>
